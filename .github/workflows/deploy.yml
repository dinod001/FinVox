name: CI / Syntax Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Compile Python files (Check for syntax errors)
      run: |
        # This will compile all .py files in the project and fail if there are syntax errors.
        # Tests are currently ignored as requested.
        python -m compileall -q .
