# =============================================================================
# FinVox — Backend Service (AWS Copilot Manifest)
# Type: Load Balanced Web Service (public HTTPS endpoint via ALB)
# =============================================================================
#
# HOW TO DEPLOY:
#   copilot svc deploy --name backend --env dev
#
# ECR IMAGE:
#   Before deploying, build & push the image to ECR:
#   aws ecr get-login-password --region <AWS_REGION> | docker login --username AWS \
#     --password-stdin <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com
#   docker build -f docker/backend/Dockerfile -t finvox-backend .
#   docker tag finvox-backend:latest <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/finvox/backend:latest
#   docker push <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/finvox/backend:latest
# =============================================================================

name: backend
type: Load Balanced Web Service

# ── Container Image ────────────────────────────────────────────────────────────
image:
  # OPTION A: Build from source (Copilot builds + pushes to ECR automatically)
  build:
    dockerfile: docker/backend/Dockerfile
    context: .                            # Project root
  platform: linux/arm64                   # AWS Graviton (ARM64) - cheaper & faster

  # OPTION B: Use a pre-pushed ECR image (comment out 'build' above, use this)
  # location: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/finvox/backend:latest

  port: 8000

# ── ALB Routing ────────────────────────────────────────────────────────────────
http:
  path: '/api'                            # ALB routes any URL starting with /api to the Backend
  healthcheck:
    path: '/health'
    interval: 30s
    timeout: 10s
    healthy_threshold: 2
    unhealthy_threshold: 3
  # Uncomment to add a custom domain + HTTPS via ACM
  # alias: api.finvox.io

# ── Compute ────────────────────────────────────────────────────────────────────
cpu: 1024                                 # 1 vCPU (overridden per-env below)
memory: 2048                             # 2 GB RAM
count: 1

# Auto-scaling (optional, uncomment when ready)
# count:
#   range: 1-3
#   cooldown:
#     in: 30s
#     out: 60s
#   cpu_percentage: 70

# ── Network ────────────────────────────────────────────────────────────────────
network:
  vpc:
    placement: 'public'                   # Run in public subnet (Avoids $32 NAT Gateway fee)

# ── Environment Variables (non-secret) ────────────────────────────────────────
variables:
  HOST: "0.0.0.0"
  PORT: "8000"
  DEV_MODE: "0"
  LOG_LEVEL: "info"
  HF_HOME: "/app/.hf_cache"

# ── Secrets (from AWS SSM Parameter Store) ────────────────────────────────────
# These are pulled from SSM at container startup and injected as env vars.
# Add them first:
#   aws ssm put-parameter --name /finvox/dev/OPENAI_API_KEY --value "sk-..." \
#     --type SecureString --region <AWS_REGION>
secrets:
  OPENAI_API_KEY:           /finvox/dev/OPENAI_API_KEY
  ANTHROPIC_API_KEY:        /finvox/dev/ANTHROPIC_API_KEY
  GROQ_API_KEY:             /finvox/dev/GROQ_API_KEY
  TAVILY_API_KEY:           /finvox/dev/TAVILY_API_KEY
  LANGFUSE_SECRET_KEY:      /finvox/dev/LANGFUSE_SECRET_KEY
  LANGFUSE_PUBLIC_KEY:      /finvox/dev/LANGFUSE_PUBLIC_KEY
  LANGFUSE_HOST:            /finvox/dev/LANGFUSE_HOST
  SUPABASE_URL:             /finvox/dev/SUPABASE_URL
  SUPABASE_KEY:             /finvox/dev/SUPABASE_KEY
  DATABASE_URL:             /finvox/dev/DATABASE_URL
  QDRANT_URL:               /finvox/dev/QDRANT_URL
  QDRANT_API_KEY:           /finvox/dev/QDRANT_API_KEY

# ── Environment Overrides ──────────────────────────────────────────────────────
environments:
  dev:
    cpu: 1024                             # 1 vCPU in dev
    memory: 2048                          # 2 GB RAM in dev
    count: 1                              # 1 task in dev
