server {
    listen 80;
    server_name _;

    # Serve static files from the Vite build output
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;

    # ── SPA Fallback ─────────────────────────────────────────────────────────
    # React Router uses client-side routing. Any path that doesn't match a
    # real file should fall back to index.html (React takes over from there).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static Asset Caching ─────────────────────────────────────────────────
    # Vite hashes asset filenames (e.g. main-abc123.js) so long cache is safe.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health Check Endpoint ─────────────────────────────────────────────────
    location /nginx-health {
        return 200 "OK";
        add_header Content-Type text/plain;
        access_log off;
    }
}
